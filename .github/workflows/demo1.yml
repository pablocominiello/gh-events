name: Events Demo 1
on: 
    pull_request:
      types:
        - opened
    workflow_dispatch:

    push:
      branches:
        - main
        - 'dev-*' # dev-new dev-another
        - 'uat/**' # uat/new uat/new/butoon
      paths-ignore:
        - '.github/workflows/*'
      
      # especificar un path
      #paths:
      #  - '.src/*'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Output event data
        run: echo "${{ toJSON(github.event) }}"
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Test code
        run: npm run test
      - name: Build code
        run: npm run build
      - name: Deploy project
        run: echo "Deploying..."